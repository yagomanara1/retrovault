<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Ícone do RetroVault: um cartucho de jogo com uma fechadura no rótulo. Fonte do build/icon.png
       (npm run icon). Formas grossas e poucas, para continuar legível em 16 px. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a9dff"/>
      <stop offset="1" stop-color="#0a5fd6"/>
    </linearGradient>
    <linearGradient id="cart" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dce9ff"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg)"/>
  <!-- Cartucho, com o canto de cima à direita chanfrado. -->
  <path d="M152 84 H322 L380 142 V404 a28 28 0 0 1 -28 28 H152 a28 28 0 0 1 -28 -28 V112 a28 28 0 0 1 28 -28 Z" fill="url(#cart)"/>
  <!-- Rótulo com a fechadura. -->
  <rect x="164" y="138" width="176" height="164" rx="20" fill="#0a5fd6"/>
  <circle cx="252" cy="200" r="30" fill="#ffffff"/>
  <path d="M236 214 H268 L280 268 H224 Z" fill="#ffffff"/>
  <!-- Ranhuras de baixo. -->
  <g fill="#0a5fd6" opacity="0.35">
    <rect x="176" y="340" width="20" height="60" rx="8"/>
    <rect x="216" y="340" width="20" height="60" rx="8"/>
    <rect x="256" y="340" width="20" height="60" rx="8"/>
    <rect x="296" y="340" width="20" height="60" rx="8"/>
  </g>
</svg>
